<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="120" viewBox="0 0 1280 120" fill="none" role="presentation">
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1280" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03060E"/>
      <stop offset=".5" stop-color="#06101F"/>
      <stop offset="1" stop-color="#0A0718"/>
    </linearGradient>

    <linearGradient id="footerEdge" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".2" stop-color="#00E5FF" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#6366F1" stop-opacity=".9"/>
      <stop offset=".8" stop-color="#FF2E97" stop-opacity=".7"/>
      <stop offset="1" stop-color="#FF2E97" stop-opacity="0"/>
    </linearGradient>

    <pattern id="footerGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1E3A5F" stroke-opacity=".22" stroke-width="1"/>
    </pattern>

    <filter id="footerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="120" rx="18" fill="url(#footerBg)"/>
  <rect width="1280" height="120" rx="18" fill="url(#footerGrid)"/>
  <path d="M1 1H1279" stroke="url(#footerEdge)" stroke-opacity=".7"/>

  <path d="M0 84H160L190 54H240" stroke="#00E5FF" stroke-opacity=".18" stroke-width="1.5"/>
  <circle cx="240" cy="54" r="2.5" fill="#00E5FF" fill-opacity=".7"/>
  <path d="M1280 88H1120L1090 58H1040" stroke="#FF2E97" stroke-opacity=".18" stroke-width="1.5"/>
  <circle cx="1040" cy="58" r="2.5" fill="#FF2E97" fill-opacity=".7"/>

  <text x="640" y="50" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#BAE6FD" filter="url(#footerGlow)">LET'S BUILD SOMETHING THAT MATTERS</text>
  <text x="640" y="78" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="2.4" fill="#64748B">GITHUB.COM/GAD-ONTUNE  //  LINKEDIN.COM/IN/GAD-ONTUNE</text>

  <circle cx="600" cy="94" r="1.8" fill="#00E5FF" fill-opacity=".8"/>
  <circle cx="620" cy="94" r="1.8" fill="#6366F1" fill-opacity=".8"/>
  <circle cx="640" cy="94" r="1.8" fill="#FF2E97" fill-opacity=".8"/>
  <circle cx="660" cy="94" r="1.8" fill="#6366F1" fill-opacity=".8"/>
  <circle cx="680" cy="94" r="1.8" fill="#00E5FF" fill-opacity=".8"/>
</svg>
