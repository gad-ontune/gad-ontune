<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Gad Ontune — Full-Stack Developer</title>
  <desc id="desc">Animated neon profile banner with the name Gad Ontune, full-stack developer role, tech stack pills, and a live terminal window.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03060E"/>
      <stop offset=".55" stop-color="#06101F"/>
      <stop offset="1" stop-color="#0A0718"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="80" y1="150" x2="640" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#A5F3FC;#FF2E97;#FFFFFF" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset=".55" stop-color="#A5F3FC">
        <animate attributeName="stop-color" values="#A5F3FC;#6366F1;#00E5FF;#A5F3FC" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#60A5FA;#FF2E97;#38BDF8;#60A5FA" dur="9s" repeatCount="indefinite"/>
      </stop>
      <animate attributeName="x1" values="80;560;80" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="640;1120;640" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".18" stop-color="#00E5FF"/>
      <stop offset=".5" stop-color="#6366F1"/>
      <stop offset=".82" stop-color="#FF2E97"/>
      <stop offset="1" stop-color="#FF2E97" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="line" x1="80" y1="0" x2="740" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#6366F1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FF2E97" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00E5FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(250 180) rotate(28) scale(360 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity=".20"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="magentaGlow" cx="0" cy="0" r="1" gradientTransform="translate(1080 260) rotate(-24) scale(320 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2E97" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FF2E97" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#1E3A5F" stroke-opacity=".30" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur">
        <animate attributeName="stdDeviation" values="7;12;7" dur="6s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="1" y="1" width="1278" height="398" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#cyanGlow)"/>
    <rect width="1280" height="400" fill="url(#magentaGlow)"/>

    <rect x="-220" y="0" width="180" height="400" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1600 0;1600 0" dur="9s" repeatCount="indefinite"/>
    </rect>

    <path d="M0 40H1280" stroke="#0EA5E9" stroke-opacity=".12"/>
    <path d="M0 360H1280" stroke="#A855F7" stroke-opacity=".10"/>

    <path d="M0 300H90L120 270H150" stroke="#00E5FF" stroke-opacity=".25" stroke-width="1.5"/>
    <circle cx="150" cy="270" r="3" fill="#00E5FF" fill-opacity=".8"/>
    <path d="M0 330H60L92 298H130" stroke="#FF2E97" stroke-opacity=".18" stroke-width="1.5"/>
    <circle cx="130" cy="298" r="2.5" fill="#FF2E97" fill-opacity=".8"/>

    <path d="M1200 90H1140L1110 120H1090" stroke="#FF2E97" stroke-opacity=".30" stroke-width="1.5"/>
    <circle cx="1090" cy="120" r="3" fill="#FF2E97" fill-opacity=".85"/>
    <path d="M1280 72H1160" stroke="#00E5FF" stroke-opacity=".18" stroke-width="1.5"/>

    <path d="M28 84V46H66" stroke="#00E5FF" stroke-opacity=".45" stroke-width="2"/>
    <path d="M1214 46H1252V84" stroke="#FF2E97" stroke-opacity=".40" stroke-width="2"/>
    <path d="M28 316V354H66" stroke="#FF2E97" stroke-opacity=".30" stroke-width="2"/>
    <path d="M1214 354H1252V316" stroke="#00E5FF" stroke-opacity=".35" stroke-width="2"/>

    <g>
      <circle cx="190" cy="118" r="2" fill="#00E5FF">
        <animateTransform attributeName="transform" type="translate" values="0 0;12 -8;0 0" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;.8;.2" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="60" r="1.6" fill="#38BDF8">
        <animateTransform attributeName="transform" type="translate" values="0 0;8 12;0 0" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;.6;.2" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="720" cy="330" r="1.8" fill="#FF2E97">
        <animateTransform attributeName="transform" type="translate" values="0 0;-10 -6;0 0" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;.7;.2" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="200" r="2" fill="#6366F1">
        <animateTransform attributeName="transform" type="translate" values="0 0;-14 10;0 0" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;.8;.2" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1210" cy="56" r="1.8" fill="#FF2E97">
        <animateTransform attributeName="transform" type="translate" values="0 0;-8 10;0 0" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;.7;.2" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <rect x="1" y="1" width="1278" height="398" rx="24" stroke="url(#edge)" stroke-opacity=".8" stroke-width="2"/>

  <circle cx="64" cy="81" r="3.5" fill="#22D3EE">
    <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'JetBrains Mono', Consolas, monospace">
    <text x="80" y="86" fill="#5EEAD4" font-size="15" letter-spacing="4">~/GAD-ONTUNE</text>
    <text x="80" y="110" fill="#64748B" font-size="12" letter-spacing="2">PORTFOLIO // EDITION 2026</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="6s" repeatCount="indefinite"/>
    <text x="78" y="186" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-1" fill="url(#nameFill)" filter="url(#glow)">GAD ONTUNE</text>
  </g>

  <text x="82" y="224" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" letter-spacing="3.5" fill="#93C5FD">FULL-STACK DEVELOPER // CLEAN WEB SYSTEMS</text>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#BAE6FD">
    <g>
      <rect x="80" y="252" width="86" height="32" rx="16" fill="#071426" stroke="#0EA5E9" stroke-opacity=".55"/>
      <text x="123" y="273" text-anchor="middle">React</text>
    </g>
    <g>
      <rect x="176" y="252" width="92" height="32" rx="16" fill="#071426" stroke="#0EA5E9" stroke-opacity=".55"/>
      <text x="222" y="273" text-anchor="middle">Next.js</text>
    </g>
    <g>
      <rect x="278" y="252" width="94" height="32" rx="16" fill="#071426" stroke="#0EA5E9" stroke-opacity=".55"/>
      <text x="325" y="273" text-anchor="middle">Python</text>
    </g>
    <g>
      <rect x="382" y="252" width="100" height="32" rx="16" fill="#071426" stroke="#6366F1" stroke-opacity=".55"/>
      <text x="432" y="273" text-anchor="middle">FastAPI</text>
    </g>
    <g>
      <rect x="492" y="252" width="118" height="32" rx="16" fill="#071426" stroke="#6366F1" stroke-opacity=".55"/>
      <text x="551" y="273" text-anchor="middle">PostgreSQL</text>
    </g>
    <g>
      <rect x="620" y="252" width="94" height="32" rx="16" fill="#071426" stroke="#FF2E97" stroke-opacity=".45"/>
      <text x="667" y="273" text-anchor="middle">Docker</text>
    </g>
  </g>

  <text x="80" y="330" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2.4" fill="#A5B4FC">I DON'T JUST WRITE CODE. I BUILD WHAT'S NEXT.</text>
  <rect x="80" y="344" width="330" height="2" rx="1" fill="url(#line)">
    <animate attributeName="width" values="120;330;120" dur="5s" repeatCount="indefinite"/>
  </rect>

  <path d="M824 70V344" stroke="#1E3A8A" stroke-opacity=".60" stroke-width="1"/>

  <g>
    <rect x="872" y="74" width="336" height="272" rx="16" fill="#050A14" stroke="#1E3A8A" stroke-opacity=".75"/>
    <rect x="872" y="74" width="336" height="40" rx="16" fill="#0A1424"/>
    <rect x="872" y="98" width="336" height="16" fill="#0A1424"/>
    <path d="M872 114H1208" stroke="#1E3A8A" stroke-opacity=".60"/>
    <circle cx="896" cy="94" r="5" fill="#FF2E97" fill-opacity=".90"/>
    <circle cx="916" cy="94" r="5" fill="#FBBF24" fill-opacity=".85"/>
    <circle cx="936" cy="94" r="5" fill="#22D3EE" fill-opacity=".90"/>
    <text x="1040" y="99" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="2" fill="#64748B">gad@ontune:~</text>

    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13">
      <text x="896" y="146" fill="#00E5FF">&gt; whoami</text>
      <text x="896" y="170" fill="#E2E8F0">gad ontune</text>
      <text x="896" y="200" fill="#00E5FF">&gt; stack</text>
      <text x="896" y="224" fill="#E2E8F0">react · node · python · sql</text>
      <text x="896" y="254" fill="#00E5FF">&gt; focus</text>
      <text x="896" y="278" fill="#E2E8F0">web apps · apis · clean systems</text>
      <text x="896" y="308" fill="#00E5FF">&gt; status</text>
      <text x="896" y="332" fill="#FF2E97">building what's next</text>
      <rect x="1052" y="319" width="8" height="15" rx="2" fill="#FF2E97">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
